[project]
name = "goated-prompter"
version = "1.0.1"
description = "Standalone local prompt-generation website with a Python engine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/Jolanoff/goated-prompter"
Issues = "https://github.com/Jolanoff/goated-prompter/issues"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["goated_prompter*"]
exclude = ["tests*", "docs*", "assets*"]

[tool.setuptools.package-data]
goated_prompter = ["minimax_knowledge/*.md"]
